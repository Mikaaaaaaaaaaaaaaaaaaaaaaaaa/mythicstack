# La URL apunta a tu localhost en el puerto 3306 (donde está tu Docker)
# Se unificaron los parámetros para forzar la codificación UTF-8 de forma segura
spring.datasource.url=jdbc:mysql://localhost:3306/cartas_nueva_era?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CREDENCIALES
# ===============================

spring.datasource.username=root
spring.datasource.password=rootpassword

# ===============================
# CONFIGURACIÓN DE HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=create

spring.sql.init.mode=always


# ===============================
partida.cartas.iniciales=5
partida.hp.jugador.inicial=100
partida.hp.jugador.maximo=100
enemigo.dano.min.default=3
enemigo.dano.max.default=8