<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Lobby - MythicStack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&display=swap');

        .mythic-panel {
            background-color: rgb(0 0 0 / 0%);
            backdrop-filter: blur(5px);
            border: 1.5px solid #d4af37e6;
        }

        .titulo-lobby {
            font-family: 'Montserrat';
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--game-epic);
            text-shadow: 0 0 50px rgb(255 195 0), 5px 5px 0px black, 1.5px 0px 0px #ffff0045;
            font-size: 45px;
        }

        .btn-lobby {
            font-family: 'Montserrat';
            letter-spacing: 1px;
            background-color: transparent;
            color: #d4af37 !important;
            border: 1px solid #d4af37 !important;
            transition: 0.3s;
        }

        .btn-lobby:hover,
        .btn-lobby:focus,
        .btn-lobby:active,
        .show > .btn-lobby.dropdown-toggle {
            background-color: rgba(212, 175, 55, 0.15) !important;
            color: #d4af37 !important;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .btn-comenzar {
            text-shadow: 0.5px 0px 0.5px black, 0px 1.5px 0px #ffffff, 0px 0px 10px white;
            background: linear-gradient(200deg, #ffffff -10%, #ffc300 60%);
            font-family: 'Montserrat';
            background-color: #d4af37;
            color: #000000 !important;
            border: 3px solid black !important;
            box-shadow: 0px 7px 0px #000000, 0px 0px 50px 0px #ffc3007d;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        a.btn.btn-lg.btn-lobby {
            box-shadow: 0px 2px 0px 0px #d4af37, 0px 10px 0px black;
            letter-spacing: normal;
            text-shadow: 2px 2px 0px black;
            margin-bottom: 5px;
        }

        button#dropdownIntercambio {
            box-shadow: 0px 2px 0px 0px #d4af37, 0px 10px 0px black;
            letter-spacing: normal;
            text-shadow: 2px 2px 0px black;
            margin-bottom: 5px;
        }

        .mb-2 {
            margin-bottom: 6px;
        }

        .mt-4 {
            margin-top: 31px;
        }

        .btn-comenzar:hover {
            transform: scale(1.03);
            transition: 0.2s;
        }

        .btn-cerrar-sesion {
            background: linear-gradient(180deg, #ffff004d 0%, #bf0000 60%);
            font-family: 'Montserrat';
            letter-spacing: 1px;
            background-color: #bf0000;
            color: yellow;
            border: 3px solid #d4af37 !important;
            transition: 0.3s;
            padding: 7px 23px 7px 23px;
            text-transform: uppercase;
            font-size: 20px;
            box-shadow: 0px 7px 0px 0px black, inset -3px 3px 0px #0000002e;
            text-shadow: 0.5px 0px 0px #ffff00, 0px 1.5px 0px black;
        }

        .btn-cerrar-sesion:hover {
            transform: scale(1.05);
            transition: 0.1s;
            background: linear-gradient(180deg, #ffff004d 0%, #bf0000 60%);
            font-family: 'Montserrat';
            letter-spacing: 1px;
            background-color: #bf0000;
            color: yellow;
            border: 3px solid #d4af37 !important;
            transition: 0.3s;
            padding: 7px 23px 7px 23px;
            text-transform: uppercase;
            font-size: 20px;
            box-shadow: 0px 7px 0px 0px black, inset -3px 3px 0px #0000002e;
            text-shadow: 0.5px 0px 0px #ffff00, 0px 1.5px 0px black;
        }


    </style>
</head>
<body th:style="|background-image: url('@{/img/LobbyFondo.jpg}'); background-size: cover; background-position: center; background-attachment: fixed;font-family: 'Montserrat';|">
<main role="main" class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-8 col-sm-10 mythic-panel text-center">

        <h1 class="mb-3 titulo-lobby">MythicStack</h1>
        <h4 class="mb-5" style="color: var(--game-muted); font-size: 1.05rem; line-height: 1.7;">
            Bienvenido,
            <span style="color: var(--game-epic); font-weight: 700;"
                  th:text="${session.USUARIO != null and !#strings.isEmpty(session.USUARIO.nombre)} ? ${session.USUARIO.nombre} : 'Aventurero'">
        Aventurero
    </span>...
            Tenés
            <span style="color: #e5a93b; font-weight: 700;"
                  th:text="${session.USUARIO != null ? session.USUARIO.oro : 0}">0</span>
            de Oro bajo tu nombre, sos Nivel
            <span style="color: #0dcaf0; font-weight: 700;"
                  th:text="${session.USUARIO != null ? session.USUARIO.nivel : 1}">1</span>
            con
            <span style="color: #0dcaf0; font-weight: 700;"
                  th:text="${session.USUARIO != null ? session.USUARIO.experiencia : 0}">0</span>
            de Experiencia en Combate. ¿Qué vas a hacer ahora?
        </h4>

        <div class="d-grid gap-3 col-6 mx-auto mt-4">

            <a th:href="@{/deckbuilding}" class="btn btn-lg btn-comenzar mb-2">Comenzar Aventura</a>

            <a th:href="@{/coleccion}" class="btn btn-lg btn-lobby">Ver Inventario</a>

            <a th:href="@{/historialPartida}" class="btn btn-lg btn-lobby">
                Historial de Aventuras
            </a>

            <a th:href="@{/tienda}" class="btn btn-lg btn-lobby">
                Ir a la Tienda del Gremio
            </a>

            <div class="dropdown">
                <button class="btn btn-lg dropdown-toggle w-100 btn-lobby" type="button" id="dropdownIntercambio"
                        data-bs-toggle="dropdown" aria-expanded="false">
                    Contratos e Intercambios
                </button>
                <ul class="dropdown-menu w-100 dropdown-menu-dark" aria-labelledby="dropdownIntercambio">
                    <li><a class="dropdown-item" th:href="@{/contrato-mejora}">Contrato de Mejora</a></li>
                    <li><a class="dropdown-item" th:href="@{/mercado}">Intercambio con Aventureros</a></li>
                </ul>
            </div>

        </div>

        <div class="mt-4" style="max-width: 240px; margin-left: auto; margin-right: auto;">
            <a th:href="@{/logout}" class="btn btn-sm btn-cerrar-sesion">Cerrar Sesión</a>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>
</html>
